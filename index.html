l":1,"pending":1}]}</script><script>const data=JSON.parse(document.getElementById('snapshot').textContent),$=id=>document.getElementById(id),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let expanded=new Set();const divisions=[...new Set(data.regions.map(r=>r.division))];
